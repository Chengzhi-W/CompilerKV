<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="490" viewBox="0 0 1120 490" role="img" aria-labelledby="title desc">
<title id="title">CompilerKV: compile once, compress at prefill, decode normally</title>
<desc id="desc">Disjoint calibration prompts and coupled CQL reward evaluation produce head reliability and risk threshold tables. At inference, observation-window attention and value norms produce stabilized utility, followed by head-weighted max pooling, entropy and perplexity gating, a budget clamp, and retained KV decoding. Generated KV states are appended normally.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.6"/></marker></defs>
<rect width="1120" height="490" rx="18" fill="#f8fafc"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="32" y="40" font-size="23" font-weight="700" fill="#0f172a">Compile once. Adapt at prefill. Decode without re-selection.</text>
<rect x="24" y="62" width="1072" height="151" rx="13" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="44" y="90" font-size="13" letter-spacing="1.3" font-weight="700" fill="#4338ca">OFFLINE · SHARED ACROSS REQUESTS</text>
