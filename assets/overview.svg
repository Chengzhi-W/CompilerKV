<text x="44" y="253" font-size="13" letter-spacing="1.3" font-weight="700" fill="#0f766e">ONLINE · ONCE AT THE END OF PREFILL</text>
<g fill="white" stroke="#cbd5e1"><rect x="44" y="274" width="220" height="121" rx="10"/><rect x="308" y="274" width="220" height="121" rx="10"/><rect x="572" y="274" width="238" height="121" rx="10"/><rect x="854" y="274" width="220" height="121" rx="10"/></g>
<g fill="#0f766e" font-size="12" font-weight="700"><text x="62" y="298">01 · STABILIZE</text><text x="326" y="298">02 · REWEIGHT</text><text x="590" y="298">03 · SELECT</text><text x="872" y="298">04 · DECODE</text></g>
<g fill="#0f172a" font-size="17" font-weight="700"><text x="62" y="327">Token utility</text><text x="326" y="327">Reliable-head veto</text><text x="590" y="327">Risk-adaptive gate</text><text x="872" y="327">Compressed KV</text></g>
<g fill="#475569" font-size="13"><text x="62" y="352">Window attention mass</text><text x="62" y="373">× normalized value norm</text><text x="326" y="352">Compiled head weights</text><text x="326" y="373">+ tokenwise max-pooling</text><text x="590" y="352">Entropy + local perplexity</text><text x="590" y="373">Threshold, then budget clamp</text><text x="872" y="352">Retain prefill subset</text><text x="872" y="373">Append generated KV</text></g>
<g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M269 334H299"/><path d="M533 334H563"/><path d="M815 334H845"/></g>
