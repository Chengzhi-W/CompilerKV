<g fill="#0f172a" font-size="17" font-weight="700"><text x="62" y="138">Calibration prompts</text><text x="348" y="138">Coupled CQL compilation</text><text x="698" y="138">Frozen lookup tables</text></g>
<g fill="#475569" font-size="14"><text x="62" y="164">Disjoint from evaluation</text><text x="348" y="164">Head ↔ gate reward evaluation</text><text x="698" y="164">Head reliability + entropy/PPL risk gate</text></g>
