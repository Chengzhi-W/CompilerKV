<rect x="44" y="419" width="1030" height="42" rx="8" fill="#e2e8f0"/>
<text x="559" y="445" text-anchor="middle" font-size="14" fill="#334155">Observation-window scan remains O(LHTW) · No online learning · No decode-time prefill re-selection</text>
