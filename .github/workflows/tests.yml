name: CPU tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Python 3.9 binaries are available on 22.04, but not Ubuntu 26.04.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    defaults:
      run:
        working-directory: CompilerKV_v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]'
      - name: Test canonical implementation
        run: python -m pytest
      - name: Check compiler CLI
        run: compilerkv-compile --help
