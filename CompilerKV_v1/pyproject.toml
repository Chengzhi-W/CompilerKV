[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compilerkv"
version = "0.2.0"
description = "Risk-adaptive KV cache compression via offline experience compilation"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "torch>=2.1",
]

[project.optional-dependencies]
evaluation = [
  "accelerate>=0.26",
  "einops>=0.7",
  "transformers>=4.44,<4.46",
]
test = ["pytest>=8"]

[project.scripts]
compilerkv-compile = "kv_compression.compiler.compile:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kv_compression*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
